name: saglik-kontrolu (gecici)
on: workflow_dispatch
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Lighthouse
        run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          for u in / /hizmetler/ /yazilar/madde-18-mi-sirket-mi-2026/ /hesaplama-merkezi/ihracat-belgeleri/ /gundem/; do
            for f in mobile desktop; do
              n=$(echo "$u-$f" | tr '/' '_')
              ex=""; [ "$f" = desktop ] && ex="--preset=desktop"
              lighthouse "https://snsdanismanlik.com.tr$u" $ex --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="r$n.json" || true
            done
          done
          node -e '
          const fs=require("fs");
          for(const f of fs.readdirSync(".").filter(x=>x.startsWith("r")&&x.endsWith(".json"))){
            const r=JSON.parse(fs.readFileSync(f));const c=r.categories;
            console.log("=== "+f+" | perf "+Math.round(c.performance.score*100)+" a11y "+Math.round(c.accessibility.score*100)+" bp "+Math.round(c["best-practices"].score*100)+" seo "+Math.round(c.seo.score*100));
            const a=r.audits;for(const k of ["first-contentful-paint","largest-contentful-paint","total-blocking-time","cumulative-layout-shift","speed-index","total-byte-weight"])if(a[k])console.log("   "+k+": "+a[k].displayValue);
            for(const [k,v] of Object.entries(a)){if(v.score!==null&&v.score<0.9&&v.scoreDisplayMode!=="informative"&&v.scoreDisplayMode!=="notApplicable"&&v.scoreDisplayMode!=="manual"){
              let ek="";if(v.details&&v.details.items)ek=" :: "+v.details.items.slice(0,4).map(i=>(i.url||(i.node&&(i.node.snippet||i.node.selector))||i.source&&i.source.url||"").toString().slice(0,110)).join(" | ");
              console.log("   ! "+k+" ("+(v.displayValue||v.score)+")"+ek)}}}'
