name: DNS kontrol (gecici)
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import smtplib
          try:
              import time
              for a in ['info@snsdanismanlik.com.tr','yokboyle-xyz@snsdanismanlik.com.tr']:
                  s=smtplib.SMTP('snsdanismanlik-com-tr.mail.protection.outlook.com',25,timeout=20)
                  s.ehlo('example.org'); s.mail('kontrol@example.org')
                  print(a, s.rcpt(a)); s.quit(); time.sleep(20)
          except Exception as e:
              print('HATA',type(e).__name__,e)
          P
