name: Duyuru kaynak kesfi (gecici)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kesif:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfalari indir
        run: |
          mkdir -p out
          i=0
          for u in \
            "https://www.turmob.org.tr/Sirkuler" \
            "https://ismmmo.org.tr/Yayin/2026-Mevzuat-Sirkulerleri--17144" \
            "https://www.turmob.org.tr/ekutuphane/dc8d2536-e967-4326-b0da-7fb62520ca32/gundemde-one-cikanlar/1" \
            "https://www.turmob.org.tr/Content/js/scripts.js" \
            "https://www.turmob.org.tr/Haberler" ; do
            i=$((i+1))
            curl -sSL -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36" -o out/$i.html -w "$i %{http_code} %{size_download} %{url_effective}\n" "$u" >> out/ozet.txt || echo "$i HATA $u" >> out/ozet.txt
          done
          cat out/ozet.txt
      - name: Kesif dalina yaz
        run: |
          cd out
          git init -q -b kesif
          git config user.name "kesif-botu"; git config user.email "kesif-botu@users.noreply.github.com"
          git add -A; git commit -qm "kesif"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" kesif
