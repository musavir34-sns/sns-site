name: IndexNow bildirimi
on:
  push:
    branches: [main]
    paths: ["kaynak/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Degisen sayfalari Bing/Yandex'e bildir
        env:
          ANAHTAR: "fb97af1c0cb6df4bd65c2ef71c4cc55e"
        run: |
          sleep 90   # GitHub Pages yayininin tamamlanmasini bekle
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          alan = "https://snsdanismanlik.com.tr"
          dosyalar = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.split()
          yollar = set()
          for d in dosyalar:
              if not d.startswith("kaynak/") or not d.endswith(".html") or not os.path.exists(d):
                  continue
              m = re.search(r'"(?:yol|slug)":\s*"([^"]+)"', open(d, encoding="utf-8").read(2000))
              if d == "kaynak/tek-sayfa.html":
                  yollar.add("/")
              elif m and '"slug"' in m.group(0):
                  yollar.add("/yazilar/%s/" % m.group(1))
              elif m:
                  yollar.add(m.group(1))
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":   # elle calistirilinca tum site haritasi
              yollar = set(re.findall(r"<loc>https://snsdanismanlik\.com\.tr([^<]+)</loc>", open("sitemap.xml").read()))
          if not yollar:
              print("Bildirilecek sayfa yok"); raise SystemExit
          govde = json.dumps({"host": "snsdanismanlik.com.tr", "key": os.environ["ANAHTAR"],
                               "keyLocation": alan + "/" + os.environ["ANAHTAR"] + ".txt",
                               "urlList": sorted(alan + y for y in yollar)}).encode()
          istek = urllib.request.Request("https://api.indexnow.org/indexnow", data=govde, headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(istek) as yanit:
              print(yanit.status, sorted(yollar))
          PY
